<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Maya Kasir Agen46</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#2e2a26; --navy2:#1f1c19; --amber:#c0573a; --amber2:#96401f;
  --cream:#f3ede3; --paper:#fffdf8; --ink:#1d2433; --muted:#5d6678; --line:#e3dccd;
  --ok:#1f8a4c; --okbg:#e3f4e8; --bad:#c2410c; --badbg:#fdebe3; --mid:#9a6700; --midbg:#fdf3d8;
  --app:#2347a8; --app2:#18337f; --appbg:#eef2fb;
  --s1:#c0573a; --s2:#4f7a5a; --s3:#b7832f; --s4:#3d6f8e;
  --shadow:0 10px 30px rgba(20,30,50,.12); --r:16px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
input,select{font:inherit;color:var(--ink)}
svg{display:block}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.ico{width:20px;height:20px;flex:none}

/* ---------- SPLASH ---------- */
.splash{position:fixed;inset:0;display:grid;place-items:center;text-align:center;cursor:pointer;padding:24px;color:#fff;
  background:radial-gradient(ellipse at 50% 45%,#36547f 0%,#1f3354 45%,#111d33 100%)}
.logo{display:flex;align-items:center;gap:18px;justify-content:center}
.logo-tile{width:80px;height:80px;border-radius:20px;background:linear-gradient(160deg,#ffd877,#f5b82e);box-shadow:0 7px 0 var(--amber2),0 18px 30px rgba(0,0,0,.35);display:grid;place-items:center;transform:rotate(-6deg);color:#3a2a00}
.logo-tile svg{width:44px;height:44px}
.logo-text{text-align:left}
.logo-text small{display:block;color:var(--amber);font-weight:800;font-size:17px}
.logo-text b{display:block;font-size:clamp(34px,6vw,52px);font-weight:800;line-height:1;letter-spacing:-.01em}
.splash .sub{opacity:.85;margin:14px 0 0}
.tap{margin-top:30px;font-weight:700;opacity:.9;animation:pulse 1.6s infinite;display:flex;gap:8px;align-items:center;justify-content:center}
.splash .foot{position:absolute;bottom:14px;left:0;right:0;font-size:11px;opacity:.6}
@keyframes pulse{50%{opacity:.35}}

/* ---------- SHELL ---------- */
.shell{max-width:1240px;margin:0 auto;padding:16px}
.scene{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);
  background:linear-gradient(180deg,#e7eff6 0%,#dfe9f2 64%,#c9976a 64%,#c9976a 66%,#b38056 66%,#a87650 100%);min-height:600px}
.scene::before{content:"";position:absolute;left:4%;top:120px;width:220px;height:210px;border-radius:10px;background:linear-gradient(135deg,#bfe0f3,#e9f6fd);border:10px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.shelf{position:absolute;right:3%;top:150px;width:150px;height:240px;background:#8a5a36;border-radius:8px;padding:10px;display:grid;grid-template-rows:repeat(3,1fr);gap:10px}
.shelf div{background:#6b4428;border-radius:4px;display:flex;align-items:flex-end;gap:4px;padding:0 6px}
.shelf i{display:block;width:16px;border-radius:3px 3px 0 0}
.wallclock{position:absolute;right:calc(3% + 160px);top:118px;width:58px;height:58px;border-radius:50%;background:#fff;border:5px solid #253650;display:grid;place-items:center;font:700 12px var(--mono);color:#253650}
.topbar{position:relative;z-index:3;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 16px}
.welcome{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:12px 18px;box-shadow:0 6px 18px rgba(20,30,50,.1);max-width:640px}
.welcome .badge{width:46px;height:46px;border-radius:12px;background:var(--navy);color:var(--amber);display:grid;place-items:center;flex:none}
.welcome h1{margin:0;font-size:18px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.02em}
.welcome p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{width:40px;height:40px;border-radius:12px;border:0;background:#fff;color:var(--navy);display:grid;place-items:center;box-shadow:0 3px 10px rgba(20,30,50,.12)}
.tbtn:hover{background:#fff7e2}
.tbtn svg{width:20px;height:20px}

.hub{position:relative;z-index:2;display:grid;grid-template-columns:280px 1fr;gap:8px;padding:0 16px 22px;align-items:end}
.guide-col{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:440px}
.guide-svg{width:230px;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.bubble{position:relative;background:#fff;border-radius:16px;padding:12px 14px;font-size:14px;box-shadow:0 6px 18px rgba(20,30,50,.14);margin-bottom:10px;max-width:270px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:18px;height:18px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.bubble b{color:var(--navy)}
.stage-area{padding-bottom:12px}
.pick{text-align:center;margin:0 0 6px}
.pick span{display:inline-block;background:var(--navy);color:#fff;font-weight:800;font-size:14px;padding:8px 22px;border-radius:999px;letter-spacing:.04em}
.pick p{margin:6px 0 12px;font-size:13px;color:#30405c}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stage{background:#fff;border-radius:16px;padding:12px;box-shadow:0 8px 20px rgba(20,30,50,.12);display:flex;flex-direction:column;gap:8px;border:2px solid transparent;transition:transform .15s}
.stage.active{border-color:var(--s2);transform:translateY(-3px)}
.stage.locked{background:#f3f1ec}
.stage.locked .art,.stage.locked h3,.stage.locked p{filter:grayscale(.7);opacity:.7}
.stage .tag{align-self:flex-start;font-size:11px;font-weight:800;color:#fff;padding:3px 9px;border-radius:999px;letter-spacing:.04em}
.stage .art{height:96px;border-radius:12px;display:grid;place-items:center}
.stage .art svg{width:58px;height:58px}
.stage h3{margin:2px 0 0;font-size:15px;font-weight:800;text-align:center;text-transform:uppercase;color:var(--navy)}
.stage p{margin:0;font-size:12.5px;color:var(--muted);text-align:center;flex:1}
.stage .score{font-size:12px;text-align:center;font-weight:700;color:var(--ok)}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;background:#e9edf4;color:var(--navy);text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--s2);color:#fff;box-shadow:0 3px 0 #3b5d44}
.btn.primary:hover{background:#5a8a66}
.btn.amber{background:var(--amber);color:#fff;box-shadow:0 3px 0 var(--amber2)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}
.btn.lock{background:#a3aab6;color:#fff;box-shadow:none}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- PANELS (studi/materi/eval) ---------- */
.panel{position:relative;z-index:2;background:var(--paper);border-radius:20px;margin:0 16px 18px;padding:22px;box-shadow:0 10px 26px rgba(20,30,50,.14)}
.panel h2{margin:0 0 6px;font-size:22px;color:var(--navy)}
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.crumb .pill{font-size:11px;font-weight:800;color:#fff;padding:3px 10px;border-radius:999px}
.progress{height:8px;background:#e8e2d4;border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:var(--s2);border-radius:99px;transition:width .3s}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

.story{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.story-scene{position:relative;border-radius:16px;min-height:300px;background:linear-gradient(180deg,#eaf2f8 0 68%,#c9976a 68% 71%,#b38056 71%);display:flex;align-items:flex-end;justify-content:space-around;padding:16px 10px 0;overflow:hidden}
.actor{display:flex;flex-direction:column;align-items:center;max-width:48%}
.actor svg{width:130px;height:auto}
.actor .say{background:#fff;border-radius:14px;padding:8px 11px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.1);margin-bottom:6px;position:relative}
.actor .say::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.actor .nm{font-size:11px;font-weight:700;background:var(--navy);color:#fff;padding:2px 8px;border-radius:99px;margin-top:-4px;position:relative;z-index:1}
.story-text{font-size:16px;line-height:1.65}
.story-text .num{font:700 12px var(--mono);color:var(--s1);letter-spacing:.06em}

.quiz-q{font-size:17px;font-weight:700;margin:4px 0 14px;line-height:1.45}
.choices{display:grid;gap:10px}
.choice{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;font-size:15px}
.choice:hover:not(:disabled){border-color:var(--s2);background:#f5f9ff}
.choice .k{flex:none;width:28px;height:28px;border-radius:50%;background:#eef1f6;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--navy)}
.choice.right{border-color:var(--ok);background:var(--okbg)}
.choice.wrong{border-color:var(--bad);background:var(--badbg)}
.choice:disabled{opacity:1}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px}
.explain.okb{background:var(--okbg);border-left:4px solid var(--ok)}
.explain.badb{background:var(--badbg);border-left:4px solid var(--bad)}

.materi{display:grid;grid-template-columns:230px 1fr;gap:20px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mlist button{text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.mlist button.on{background:#e6eefc;color:var(--app2);font-weight:700}
.mlist button .d{width:22px;height:22px;border-radius:50%;background:#e8e2d4;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.mlist button.seen .d{background:var(--ok);color:#fff}
.mbody h3{margin:0 0 10px;font-size:20px;color:var(--navy)}
.mbody p{margin:0 0 10px}
.mbody ul,.mbody ol{margin:0 0 10px;padding-left:22px}
.mbody li{margin-bottom:5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 12px}
.cardx{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px}
.cardx b{display:block;color:var(--navy);font-size:15px}
.cardx .big{font-size:26px;font-weight:800;color:var(--s3);line-height:1}
.cardx span{font-size:13px;color:var(--muted)}
.callout{background:#fff8e6;border:1.5px solid #f3d58a;border-radius:12px;padding:10px 14px;font-size:14px;margin:10px 0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border-radius:12px;overflow:hidden}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:700}
table.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
.steps-ol{counter-reset:s;list-style:none;padding:0!important}
.steps-ol li{counter-increment:s;position:relative;padding:8px 10px 8px 46px;background:#fff;border:1.5px solid var(--line);border-radius:12px;margin-bottom:7px}
.steps-ol li::before{content:counter(s);position:absolute;left:10px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--s3);color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px}

/* ---------- IDENTITAS ---------- */
.idcard{max-width:460px;margin:60px auto;background:#fff;border-radius:22px;padding:26px;box-shadow:var(--shadow)}
.idcard h2{margin:0 0 4px;color:var(--navy)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld span{font-size:13px;font-weight:700;color:#3a4558}
.fld input,.fld select{border:1.5px solid #d6d9e0;border-radius:11px;padding:10px 12px;background:#fff;font-size:15px;width:100%}
.fld input:focus,.fld select:focus{outline:3px solid #c9dafc;border-color:var(--app)}
.msg{font-size:13px;margin:8px 0 0;padding:8px 10px;border-radius:10px}
.msg.bad{background:var(--badbg);color:#8a2c07}
.msg.ok{background:var(--okbg);color:#14603a}
.msg.info{background:#e8eefc;color:#1d3b8a}

/* ---------- LAB ---------- */
.labbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:10px 14px;border-radius:16px;margin-bottom:12px}
.labbar .ttl{font-weight:800;font-size:15px;margin-right:auto;display:flex;align-items:center;gap:10px}
.labbar .ttl small{display:block;font-weight:500;font-size:12px;opacity:.75}
.stat{background:rgba(255,255,255,.1);border-radius:10px;padding:5px 10px;font-size:12px;line-height:1.25}
.stat b{display:block;font-size:14px}
.sat{width:120px}
.sat .bar{height:7px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:4px}
.sat .bar i{display:block;height:100%;border-radius:9px;transition:width .4s,background .4s}
.labbar .tbtn{width:36px;height:36px}
.labgrid{display:grid;grid-template-columns:minmax(0,1.15fr) 340px minmax(0,1fr);gap:12px;align-items:start}
.pane{background:var(--paper);border-radius:18px;box-shadow:0 6px 18px rgba(20,30,50,.1);padding:14px}
.pane-h{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);margin-bottom:10px;font-size:14px}
.pane-h .muted{margin-left:auto;font-weight:600;font-size:13px}
.pane-h svg{width:18px;height:18px}

.counter{position:relative;border-radius:14px;background:linear-gradient(180deg,#e9f1f7 0 74%,#c9976a 74% 78%,#b38056 78%);padding:12px 12px 0;display:flex;gap:10px;align-items:flex-end;min-height:200px}
.counter .who{display:flex;flex-direction:column;align-items:center;flex:none}
.counter .who svg{width:128px;height:auto}
.queue{position:absolute;left:10px;top:10px;font:700 11px var(--mono);background:#fff;border-radius:8px;padding:3px 8px;color:var(--navy)}
.cbubble{flex:1;background:#fff;border-radius:16px;padding:12px 14px;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:60px;position:relative;align-self:center}
.cbubble::before{content:"";position:absolute;left:-7px;top:22px;width:14px;height:14px;background:#fff;transform:rotate(45deg)}
.cbubble .nm{display:block;font-size:12px;font-weight:800;color:var(--navy);margin-bottom:3px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eef1f6;color:#3a4558;margin-left:4px}
.chip.marah,.chip.komplain{background:#fde2d8;color:#9a3412}
.chip.terburu{background:#fdf0cc;color:#8a5a00}
.chip.lansia{background:#e6e9fb;color:#3c3f99}
.chip.bingung{background:#e2f2f0;color:#1f6b63}
.docs{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.doc{border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.4;box-shadow:0 3px 8px rgba(0,0,0,.1);min-width:150px}
.doc .h{font-weight:800;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;opacity:.85;margin-bottom:3px}
.doc.card{background:linear-gradient(135deg,#2b4c8c,#1c2f5c);color:#fff;width:200px}
.doc.card .no{font:600 13px var(--mono);letter-spacing:.06em;margin:8px 0 4px}
.doc.buku{background:#e6f1e4;border:1px solid #b9d5b3;color:#24442a}
.doc.ktp{background:linear-gradient(135deg,#d7ebfa,#b9d8f2);color:#173a5c;min-width:250px}
.doc.ktp table{border-collapse:collapse}
.doc.ktp td{padding:0 6px 0 0;vertical-align:top}
.doc.note{background:#fff8b8;color:#3b3200;font-family:'Caveat',cursive;font-size:19px;line-height:1.2;transform:rotate(-1.5deg);min-width:160px}
.doc.tagihan{background:#fff;border:1px dashed #b9b2a2;font-family:var(--mono);font-size:11.5px}
.doc.kp{background:linear-gradient(135deg,#eef3ff,#d6e2fb);color:#1d3b6e}
.doc.bpjs{background:linear-gradient(135deg,#e3f5ea,#c5ead2);color:#164a2c}
.doc b{font-weight:700}
.dlg{margin-top:12px}
.dlg .lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14.5px}
.opt:hover{border-color:var(--s2);background:#f5f9ff}
.fb{border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.fb.best{background:var(--okbg)}
.fb.ok{background:var(--midbg)}
.fb.bad{background:var(--badbg)}
.fb .g{width:46px;flex:none}
.fb .tagq{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;color:#fff;margin-bottom:4px}
.fb.best .tagq{background:var(--ok)}.fb.ok .tagq{background:var(--mid)}.fb.bad .tagq{background:var(--bad)}
.fb p{margin:0 0 8px;font-size:14px}
.hintbox{margin-top:12px;background:#eef3fd;border-radius:12px;padding:10px 12px;font-size:13.5px;color:#1d3b8a;display:flex;gap:8px;align-items:center}

/* phone */
.phonewrap{display:flex;flex-direction:column;align-items:center;gap:10px;background:transparent;box-shadow:none;padding:0}
.phone{position:relative;width:320px;height:610px;border-radius:38px;background:#111;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.screen{position:relative;width:100%;height:100%;border-radius:28px;background:var(--appbg);overflow:hidden;display:flex;flex-direction:column}
.ph-status{display:flex;justify-content:space-between;font:600 11px var(--mono);padding:8px 18px 4px;background:var(--app2);color:#fff}
.ph-head{display:flex;align-items:center;gap:9px;padding:8px 14px 12px;background:var(--app2);color:#fff}
.ph-logo{width:34px;height:34px;border-radius:10px;background:var(--amber);color:#3a2a00;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.ph-head b{display:block;font-size:14px;line-height:1.1}
.ph-head small{display:block;font-size:11px;opacity:.75}
.ph-saldo{margin-left:auto;text-align:right}
.ph-saldo b{font-size:12.5px}
.ph-body{flex:1;overflow-y:auto;padding:12px}
.ph-title{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--app2);margin:0 0 10px;font-size:15px}
.ph-title button{border:0;background:#fff;border-radius:9px;width:30px;height:30px;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ph-title button svg{width:16px;height:16px}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph-menu{border:0;background:#fff;border-radius:14px;padding:10px 4px;font-size:11px;font-weight:700;color:#24324d;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.06);line-height:1.2;text-align:center;min-height:82px}
.ph-menu:hover{background:#f7f9ff;outline:2px solid #c9d6f6}
.mi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff}
.mi svg{width:20px;height:20px}
.ph-banner{background:linear-gradient(120deg,var(--app),#4a73d6);color:#fff;border-radius:14px;padding:12px;margin-bottom:12px;font-size:12px}
.ph-banner b{display:block;font-size:18px}
.pf{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.pf span{font-size:11.5px;font-weight:700;color:#3a4558}
.pf input,.pf select{border:1.5px solid #cfd6e4;border-radius:10px;padding:8px 10px;background:#fff;font-size:14px;width:100%}
.pf input:focus,.pf select:focus{outline:2px solid #b8cbf6;border-color:var(--app)}
.pf .pv{font-size:11px;color:var(--app);font-weight:700;min-height:14px}
.ph-btn{width:100%;border:0;border-radius:12px;padding:11px;font-weight:800;font-size:14px;background:var(--app);color:#fff;display:flex;gap:6px;align-items:center;justify-content:center}
.ph-btn svg{width:18px;height:18px}
.ph-btn.ghost{background:#fff;color:var(--app);border:1.5px dashed #9fb3e6}
.ph-btn.soft{background:#fff;color:#24324d;border:1.5px solid #cfd6e4}
.ph-btn.green{background:var(--ok)}
.ph-btn.warn{background:#fff;color:var(--bad);border:1.5px solid #f0b9a1}
.ph-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:6px}
.ph-cardread{background:linear-gradient(135deg,#2b4c8c,#1c2f5c);color:#fff;border-radius:12px;padding:9px 11px;font-size:12px}
.ph-cardread b{display:block;font:600 13px var(--mono)}
.rows{background:#fff;border-radius:12px;padding:4px 12px;margin:0 0 10px}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed #e1e5ee;font-size:12.5px}
.rows div:last-child{border-bottom:0}
.rows dt{color:#5d6678;margin:0}
.rows dd{margin:0;font-weight:700;text-align:right;word-break:break-word}
.rows .tot dd{color:var(--app2);font-size:14px}
.ph-err{background:var(--badbg);color:#8a2c07;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:8px}
.ph-note{background:#fff8e6;color:#6b4a00;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:8px}
.ph-center{text-align:center;padding-top:6px}
.ph-center h4{margin:8px 0 4px;color:var(--app2);font-size:16px}
.ph-center p{margin:0 0 12px;font-size:13px;color:#4a5468}
.okc{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:4px auto 0}
.okc svg{width:34px;height:34px}
.pindots{display:flex;gap:10px;justify-content:center;margin:10px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--app);display:block}
.pindots i.f{background:var(--app)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.keypad button{border:0;background:#fff;border-radius:12px;height:46px;font-size:18px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.keypad button:active{background:#e3eafb}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wait i{animation:blink 1s infinite}
.wait i:nth-child(2){animation-delay:.15s}.wait i:nth-child(3){animation-delay:.3s}.wait i:nth-child(4){animation-delay:.45s}.wait i:nth-child(5){animation-delay:.6s}.wait i:nth-child(6){animation-delay:.75s}
@keyframes blink{50%{background:var(--app)}}
.receipt{background:#fff;font:12px/1.45 var(--mono);padding:12px 10px;border-radius:4px;white-space:pre;overflow-x:auto;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:10px;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) bottom/12px 8px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) bottom/12px 8px repeat-x}
.ph-lock{position:absolute;inset:0;background:rgba(20,30,55,.72);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:10px;font-weight:600;z-index:5;border-radius:28px}
.ph-lock svg{width:36px;height:36px}
.protest{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px}
.protest svg{width:56px;flex:none}
.protest p{margin:0;font-size:13.5px}
.hist div{background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:12px}
.sticky{background:#fff59d;color:#4a4100;font-family:'Caveat',cursive;font-size:20px;line-height:1.1;padding:8px 14px;transform:rotate(2deg);box-shadow:0 4px 10px rgba(0,0,0,.12);text-align:center;max-width:300px}
.sticky small{display:block;font-family:var(--font);font-size:10.5px;color:#6b5c00}

/* cash */
.bills{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
.bill{width:62px;height:30px;border-radius:5px;display:grid;place-items:center;color:#fff;font:700 10.5px var(--mono);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.2);position:relative}
.bill.coin{width:30px;height:30px;border-radius:50%;color:#5a4300;font-size:9px}
.b100000{background:#d9566d}.b50000{background:#3b7fc4}.b20000{background:#3a9e68}.b10000{background:#8a5fbf}.b5000{background:#a0703f}.b2000{background:#7c8492}.b1000{background:#5f9c8c}.b500{background:radial-gradient(circle at 35% 35%,#ffe9a3,#d8a933)}
.drawer{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#6b4428;padding:8px;border-radius:12px}
.dz{border:0;background:#8a5a36;border-radius:9px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff}
.dz:hover:not(:disabled){background:#a06a42}
.dz small{font-size:10px;opacity:.85}
.dz .bill{width:54px;height:26px;font-size:9.5px}
.dz .bill.coin{width:26px;height:26px}
.tray{background:#fff;border:1.5px dashed #c9bfa8;border-radius:12px;padding:8px 10px;margin:10px 0}
.tray-h{font-size:13px;margin-bottom:4px}
.tb{border:0;background:transparent;padding:0}
.kasmini{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--muted)}
.kasmini span{background:#fff;border-radius:7px;padding:4px 5px;text-align:center}

/* tasks */
.tasks{list-style:none;padding:0;margin:0}
.tasks li{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;font-size:13px;color:var(--muted)}
.tasks li .c{width:20px;height:20px;border-radius:50%;border:2px solid #cfc7b5;flex:none;display:grid;place-items:center}
.tasks li .c svg{width:12px;height:12px}
.tasks li.done{color:#2b3a2f}
.tasks li.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.tasks li.cur{background:#fff3d1;color:var(--ink);font-weight:700}
.tasks li.cur .c{border-color:var(--amber2)}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(15,22,40,.55);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 8px;color:var(--navy);font-size:19px}
.mbox p,.mbox li{font-size:14.5px}
.scorebig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.scorebig div{background:#f5f2ea;border-radius:14px;padding:12px;text-align:center}
.scorebig b{display:block;font-size:30px;color:var(--navy);line-height:1.1}
.scorebig span{font-size:12px;color:var(--muted);font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--navy);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:tin .25s}
#toast div.bad{background:var(--bad)}
#toast div.ok{background:var(--ok)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* hasil */
.sheet{max-width:820px;margin:0 auto;background:#fff;border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.sheet .hd{display:flex;gap:14px;align-items:center;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:14px}
.sheet .hd h2{margin:0;font-size:20px;color:var(--navy)}
.sheet .hd p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.idt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.idt div{background:#f6f3ec;border-radius:10px;padding:8px 12px;font-size:13px}
.idt b{display:block;font-size:15px}
.final{display:flex;align-items:center;gap:18px;background:var(--navy);color:#fff;border-radius:16px;padding:16px 20px;margin:14px 0}
.final .n{font-size:46px;font-weight:800;line-height:1;color:var(--amber)}
.final .p{font-size:14px}
.final .p b{font-size:18px;display:block}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px;font-size:13px;text-align:center}
.sign .sp{height:60px}

/* ---------- identitas visual: kertas, terakota, hijau sage ---------- */
body{background:var(--cream) radial-gradient(circle at 1px 1px,rgba(60,45,35,.07) 1px,transparent 0) 0 0/18px 18px}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;font-size:16px;line-height:1.1;color:var(--navy)}
.brand small{display:block;font-size:12px;color:var(--muted)}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--amber);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.02em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand-mark.sm{width:28px;height:28px;font-size:12px;border-radius:8px}
.appnav{display:flex;gap:6px;flex-wrap:wrap}
.navbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--navy)}
.navbtn:hover{border-color:var(--s2);color:var(--s2)}
.navbtn svg{width:16px;height:16px}
.navbtn.icon{padding:7px 9px}
.pagehead{margin:4px 4px 14px}
.pagehead h1{margin:0;font-size:24px;color:var(--navy)}
.pagehead p{margin:2px 0 0;color:var(--muted)}
.panel{margin:0 0 18px}

.splash2{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.splash-in{display:grid;grid-template-columns:1.2fr 360px;gap:40px;align-items:center;max-width:1000px;width:100%}
.sp-kicker{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--s2);background:#e6efe8;padding:4px 10px;border-radius:999px}
.sp-copy h1{font-size:clamp(32px,5vw,52px);line-height:1.05;margin:14px 0 12px;color:var(--navy);letter-spacing:-.02em}
.sp-copy h1 em{font-style:normal;color:var(--amber)}
.sp-copy p{font-size:16.5px;color:#4a4540;max-width:520px;margin:0 0 16px}
.sp-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.sp-list li{display:flex;gap:10px;align-items:center;font-weight:600;color:var(--navy)}
.sp-list svg{width:20px;height:20px;color:var(--amber)}
.ticket{position:relative;background:#fff;border-radius:18px;padding:24px 24px 18px;text-align:center;box-shadow:0 18px 40px rgba(60,40,25,.16);transform:rotate(1.5deg)}
.ticket::before,.ticket::after{content:"";position:absolute;top:118px;width:26px;height:26px;border-radius:50%;background:var(--cream)}
.ticket::before{left:-13px}.ticket::after{right:-13px}
.t-top{font:700 11px var(--mono);letter-spacing:.12em;color:var(--muted)}
.t-num{font:600 64px/1.1 var(--mono);color:var(--navy);margin:6px 0 10px}
.t-line{border-top:2px dashed var(--line);margin:0 -24px 16px}
.t-sub{font-size:14px;color:#4a4540;margin-bottom:14px}
.t-foot{font-size:11px;color:var(--muted);margin-top:12px}

.hero{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-bottom:22px}
.mentor{display:flex;gap:16px;align-items:flex-end;background:#e6efe8;border-radius:18px;padding:16px 18px 0;overflow:hidden}
.mentor-ava{width:150px;flex:none}
.mentor-ava.sm{width:64px;border-radius:50%;background:#e6efe8;overflow:hidden}
.memo{background:#fffdf6 repeating-linear-gradient(transparent 0 25px,#ece4d4 25px 26px);border-radius:12px 12px 0 0;padding:14px 16px 16px;flex:1;align-self:stretch;box-shadow:0 -2px 10px rgba(0,0,0,.04)}
.memo-h{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--s2);margin-bottom:4px}
.memo p{margin:0 0 8px;font-size:15px;line-height:1.7}
.memo-sign{font-family:'Caveat',cursive;font-size:20px;color:var(--amber2)}
.idbadge{background:#fff;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.idb-top{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;padding:9px 14px;font:700 11px var(--mono);letter-spacing:.1em}
.idb-body{display:flex;gap:12px;align-items:center;padding:14px}
.idb-photo{width:54px;height:62px;border-radius:8px;background:#efe8dc;display:grid;place-items:center;color:var(--muted)}
.idb-photo svg{width:30px;height:30px}
.idb-body b{display:block;font-size:16px;color:var(--navy)}
.idb-body span,.idb-prog span{font-size:13px;color:var(--muted)}
.idb-prog{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1.5px dashed var(--line);margin-top:auto}
.idb-prog b{display:block;font-size:13.5px}
.ring{--p:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--s2) calc(var(--p)*1%),#ece5d8 0);display:grid;place-items:center;flex:none}
.ring span{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--navy)}
.sec{font-size:18px;color:var(--navy);margin:0 4px 12px}
.journey{list-style:none;padding:0;margin:0;position:relative}
.journey::before{content:"";position:absolute;left:21px;top:20px;bottom:20px;border-left:3px dotted #cdbfa8}
.jstep{position:relative;display:grid;grid-template-columns:46px 1fr;gap:12px;margin-bottom:12px}
.jnode{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid #cdbfa8;display:grid;place-items:center;font-weight:800;color:var(--muted);margin-top:10px}
.jnode svg{width:18px;height:18px}
.jstep.done .jnode{background:var(--s2);border-color:var(--s2);color:#fff}
.jstep.now .jnode{background:var(--amber);border-color:var(--amber);color:#fff;box-shadow:0 0 0 6px rgba(192,87,58,.15)}
.jcard{display:grid;grid-template-columns:auto auto 1fr auto;gap:14px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.jstep.now .jcard{border-color:var(--amber);box-shadow:0 8px 22px rgba(192,87,58,.12)}
.jstep.locked .jcard{background:#f7f3ec}
.jstep.locked .jtext,.jstep.locked .jic{opacity:.6}
.jtime{font:600 13px var(--mono);color:var(--muted);background:#f4efe6;padding:4px 8px;border-radius:8px}
.jic{width:42px;height:42px;border-radius:12px;background:#f4e4dc;color:var(--amber);display:grid;place-items:center}
.jstep.done .jic{background:#e6efe8;color:var(--s2)}
.jic svg{width:22px;height:22px}
.jtext h3{margin:0;font-size:16px;color:var(--navy)}
.jtext h3 small{font-weight:600;font-size:12.5px;color:var(--muted);margin-left:6px}
.jtext p{margin:2px 0 0;font-size:13.5px;color:#5a544d}
.jscore{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;color:var(--s2);background:#e6efe8;padding:2px 9px;border-radius:999px}
.jcard .btn{min-width:130px}
.rapor-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:16px;padding:14px 18px;margin-top:8px}
.rapor-cta b{display:block}.rapor-cta span{font-size:13px;opacity:.8}
.idcard-h{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.idcard-h h2{margin:0}
.fb .g{width:46px;border-radius:50%;background:#fff;overflow:hidden}
@media (max-width:860px){
  .splash-in{grid-template-columns:1fr}
  .ticket{transform:none;max-width:380px;margin:0 auto;width:100%}
  .hero{grid-template-columns:1fr}
  .mentor-ava{width:96px}
  .jcard{grid-template-columns:auto 1fr;}
  .jcard .jtime{grid-column:1 / -1;justify-self:start}
  .jcard .btn{grid-column:1 / -1;width:100%}
}
@media (max-width:480px){
  .mentor{flex-direction:column;align-items:center}
  .navbtn span{display:none}
  .navbtn{padding:7px 9px}
}
/* Persiapan shift (SOP) */
.sopbar{list-style:none;display:flex;gap:6px;flex-wrap:wrap;padding:0;margin:0 0 16px}
.sopbar li{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);background:#f4efe6;border-radius:999px;padding:5px 12px 5px 5px}
.sopbar li span{width:22px;height:22px;border-radius:50%;background:#e2d9c8;display:grid;place-items:center;font-size:11px}
.sopbar li.cur{background:#fbe6dc;color:var(--amber2)}.sopbar li.cur span{background:var(--amber);color:#fff}
.sopbar li.done{color:var(--s2)}.sopbar li.done span{background:var(--s2);color:#fff}
.profgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.profcard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.profcard:hover{border-color:var(--amber)}
.profcard .petugas{width:120px;height:auto}
.dress{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.mirror{background:linear-gradient(180deg,#eef3f6,#dfe8ee);border:8px solid #c9b79c;border-radius:110px 110px 18px 18px;padding:10px;text-align:center}
.mirror-h{font:700 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.mirror .petugas{width:100%;max-width:200px;height:auto;margin:0 auto}
.areagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.acard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.acard b{color:var(--navy)}
.acard p{margin:0;font-size:13.5px}
.acard.fixed{background:var(--okbg);border-color:#9bd0ae}.acard.okd{background:#f3f8f4}
.astat{font-size:12.5px;font-weight:700;color:var(--ok)}
.aerr{color:var(--bad)!important;font-size:12.5px!important}
.btn.sm{padding:6px 12px;font-size:13px}
.decl{display:grid;gap:8px}
.dl{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.dl input{width:20px;height:20px;accent-color:var(--s2)}
.rkstats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.rkstats span{background:#f4efe6;border-radius:999px;padding:6px 12px;font-size:13px}
@media (max-width:720px){.dress{grid-template-columns:1fr}.mirror{max-width:260px;margin:0 auto}}
/* Laporan tutup shift */
.lap-h{margin:18px 0 8px;color:var(--navy);font-size:17px}
.lapgrid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.miniapp{background:var(--appbg);border:6px solid #1b1b1b;border-radius:22px;overflow:hidden}
.ma-h{display:flex;gap:8px;align-items:center;background:var(--app2);color:#fff;padding:10px 12px}
.ma-h b{display:block;font-size:13px}.ma-h small{font-size:11px;opacity:.75}
.ma-saldo{background:linear-gradient(120deg,var(--app),#4a73d6);color:#fff;margin:10px;border-radius:12px;padding:10px}
.ma-saldo small{display:block;font-size:11px;opacity:.85}.ma-saldo b{font-size:20px}
.ma-list{margin:0 10px 10px;background:#fff;border-radius:12px;padding:8px 10px;max-height:220px;overflow:auto;font-size:12px}
.ma-list small{display:block;font-weight:700;color:var(--muted);margin-bottom:4px}
.ma-list div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed #e1e5ee}
.drawerview{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;background:#6b4428;padding:10px;border-radius:14px;margin-bottom:12px}
.comp{background:#8a5a36;border-radius:10px;padding:8px;color:#fff}
.comp-h{font:700 12px var(--mono);margin-bottom:6px}

// Menyesuaikan data nasabah yang tersimpan dari versi lab sebelumnya (mis. SPP sebelum memakai menu Transfer).
function migrasiNasabah(c) {
  if (c && c.t === 'spp') {
    if (c.menu !== 'transfer') {
      const b = Number(c.exp.bulan) || 1, per = CONFIG.SPP.perBulan, adm = biaya('transfer');
      c.menu = 'transfer';
      c.exp = { bank: 'BNI', rek: c.exp.va || c.exp.rek, nominal: per * b, nama: c.data.anak };
      Object.assign(c.data, { rel: 'anak', bulan: b, adm, tag: per * b, total: per * b + adm });
      if (!(c.pay > c.data.total)) { c.pay = payFor(c.data.total); c.bills = breakdown(c.pay, false); }
    }
    if (c.exp.nama !== c.data.anak) c.exp.nama = c.data.anak;
  }
  if (c && !MENUS[c.menu]) c.menu = MENU_OF[c.t] || 'transfer';
  return c;
}
// Cek apakah nominal bisa disusun dari isi laci (cara serah uang terbesar lebih dulu).
function bisaBayar(kas, n) { let m = n; for (const d of DENOMS) { const q = Math.min(kas[d] || 0, Math.floor(m / d)); m -= q * d; } return m === 0; }
// Modal kas kecil: pastikan kembalian dan uang tarik tunai selalu bisa diserahkan dari isi laci saat itu.
function sesuaikanKas(c, kas) {
  if (!c) return c;
  if (c.menu === 'tarik') {
    const n = c.exp.nominal; if (bisaBayar(kas, n)) return c;
    const opsi = []; for (let x = n - 50000; x >= 50000; x -= 50000) if (bisaBayar(kas, x)) opsi.push(x);
    if (opsi.length) { c.need = c.need.split(fmt(n)).join(fmt(opsi[0])); c.exp.nominal = opsi[0]; }
    return c;
  }
  const tot = c.data && c.data.total;
  if (!c.pay || !tot || c.pay <= tot) return c;
  const tambah = bills => { const k = Object.assign({}, kas); bills.forEach(d => k[d] = (k[d] || 0) + 1); return k; };
  if (bisaBayar(tambah(c.bills), c.pay - tot)) return c;
  for (const u of DENOMS) {
    let p = Math.ceil(tot / u) * u; if (p === tot) p += u;
    if (p >= c.pay) continue;
    const bills = breakdown(p, false);
    if (bisaBayar(tambah(bills), p - tot)) { c.pay = p; c.bills = bills; return c; }
  }
  // Uang kecil di laci habis: nasabah menambah uang receh agar kembaliannya bulat (mis. bayar 201.500 untuk 128.500, kembali 73.000 → 75.000 dst.).
  const C = c.pay - tot;
  for (const m of [1000, 5000, 10000, 20000, 50000]) {
    const x = (m - C % m) % m; if (!x) continue;
    const bills = shuffle(c.bills.concat(breakdown(x, false)));
    if (bisaBayar(tambah(bills), C + x)) { c.pay += x; c.bills = bills; return c; }
  }
  // Cadangan terakhir: uang pas ditambah satu lembar.
  for (const d of [5000, 10000, 20000, 2000, 50000, 1000, 100000, 500]) {
    const p = tot + d, bills = breakdown(p, false);
    if (bisaBayar(tambah(bills), d)) { c.pay = p; c.bills = bills; return c; }
  }
  return c;
}

function stickyAkses() {
  return `<div class="sticky akses">Akses Agen46<span>Username: <b>${CONFIG.USER_AGEN}</b></span><span>Password: <b>${CONFIG.PASS_AGEN}</b></span><span>Password transaksi: <b>${CONFIG.PASS_TRX}</b></span><small>Khusus simulasi. Di dunia nyata data akses tidak boleh ditulis!</small></div>`;
}
function appSuccess() {
  const c = L.c, i = L.inq, A = L.app;
  switch (c.menu) {
    case 'setor': case 'bukarek': L.saldo -= i.nominal; break;
    case 'tarik': L.saldo += i.total; break;
    case 'ceksaldo': break;
    default: L.saldo -= i.total;
  }
  const now = gameTime();
  LB().riwayat.unshift(Object.assign({ jam: now, jenis: MENUS[c.menu].label, nominal: i.total, nama: i.nama }, efekTrx(c.menu, i.nominal || 0, i.total || 0)));
  L.receipt = receiptText();
  A.screen = 'success'; sfx.cash();
  completeStep();
}
function giveStruk() {
  const st = curStep();
  if (st !== 'struk') { L.app.msg = `Selesaikan dulu: ${taskLabel(st, L.c)}.`; renderPhone(); return; }
  L.app.screen = 'receipt'; L.app.msg = ''; sfx.click();
  completeStep();
}
function readCard() {
  const c = L.c;
  if (!c.docs.some(d => d.k === 'card')) { L.app.err = 'Nasabah ini tidak menyerahkan kartu untuk transaksi ini.'; renderPhone(); return; }
  L.app.form.card = true; L.app.err = ''; sfx.click(); renderPhone();
}
function gameTime() { const m = 8 * 60 + 5 + (LB() ? LB().idx : 0) * 9 + (L ? Math.min(8, Math.floor((Date.now() - L.start) / 60000)) : 0); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }

function receiptText() {
  const c = L.c, i = L.inq, f = L.app.form, W = 32;
  const ctr = s => { s = String(s); const p = Math.max(0, Math.floor((W - s.length) / 2)); return ' '.repeat(p) + s; };
  const kv = (k, v) => { k = String(k); v = String(v); const sp = W - k.length - v.length; return sp >= 1 ? k + ' '.repeat(sp) + v : k + '\n' + ' '.repeat(Math.max(0, W - v.length)) + v; };
  const line = '-'.repeat(W);
  const out = [ctr(CONFIG.NAMA_AGEN.toUpperCase()), ctr('AGEN46 - SIMULASI'), ctr(CONFIG.KODE_AGEN), line, kv('TGL', '13/11/2026 ' + gameTime()), kv('REF', L.ref), ctr(MENUS[c.menu].label.toUpperCase()), line];
  i.rows.forEach(r => out.push(kv(r[0].toUpperCase(), r[1])));
  if (c.menu === 'ceksaldo') out.push(kv('SALDO', fmt(c.data.saldo)));
  if (c.menu === 'plnpra') { out.push(line, ctr('TOKEN'), ctr(c.data.token)); }
  if (c.menu === 'bukarek') { out.push(kv('NO. REK BARU', L.newRek || (L.newRek = digits(10)))); }
  out.push(line, ctr('SIMPAN STRUK INI SEBAGAI'), ctr('BUKTI TRANSAKSI YANG SAH'), ctr('** SIMULASI PEMBELAJARAN **'));
  return out.join('\n');
}

/* ---------- uang ---------- */
const kasTotal = k => sum(Object.keys(k).map(d => d * k[d]));
function billHTML(d) { const t = d >= 1000 ? (d / 1000) + 'rb' : d; return `<span class="bill b${d}${d === 500 ? ' coin' : ''}">${d === 500 ? '500' : t}</span>`; }
function cashInOk() {
  const v = Number(onlyDigits(($('#cashInVal') || {}).value));
  const c = L.c;
  if (!v) { L.cashMsg = 'Masukkan jumlah uang yang Anda hitung.'; renderCash(); return; }
  if (v !== c.pay) {
    penalize(15, `Salah menghitung uang dari nasabah (menulis ${fmt(v)}).`);
    L.cashMsg = 'Jumlahnya belum tepat. Hitung ulang lembar demi lembar.'; insertMaaf({ jenis: 'hitung' }, `Coba dihitung lagi, ${c.panggil}.`); renderLab(); return;
  }
  c.bills.forEach(d => L.kas[d] = (L.kas[d] || 0) + 1);
  L.paid = v; sfx.cash();
  completeStep();
  line(`Iya, betul ${fmt(v)}.`); renderCust();
}
function needOut() { const c = L.c; return c.menu === 'tarik' ? c.exp.nominal : L.paid - c.data.total; }
function avail(d) { return (L.kas[d] || 0) - L.tray.filter(x => x === d).length; }
function trayGive() {
  const need = needOut(), s = sum(L.tray), c = L.c;
  if (!L.tray.length) { L.cashMsg = 'Ambil uang dari laci terlebih dahulu.'; renderCash(); return; }
  if (s !== need) {
    if (L.ujian) L.kritis.push('Menyerahkan uang tunai dengan jumlah keliru');
    penalize(15, c.menu === 'tarik' ? `Menyerahkan uang tarik tunai ${fmt(s)} (seharusnya tidak sebesar itu).` : `Memberi kembalian ${fmt(s)} (tidak tepat).`);
    L.cashMsg = s < need ? 'Uang yang diserahkan KURANG. Periksa kembali perhitungan Anda.' : 'Uang yang diserahkan LEBIH. Periksa kembali perhitungan Anda.';
    insertMaaf({ jenis: 'kembali' }, s < need ? `Kok kurang, ${c.panggil}?` : `Eh, ini kelebihan, ${c.panggil}.`);
    renderLab(); return;
  }
  L.tray.forEach(d => L.kas[d]--); L.tray = []; sfx.cash();
  completeStep();
  line(c.menu === 'tarik' ? `Sudah pas, terima kasih.` : `Kembaliannya pas. Terima kasih.`); renderCust();
}

  return `${actHTML}<div class="voice"><span class="wave">${'<i></i>'.repeat(5)}</span><span>${L.speaking ? 'Nasabah sedang berbicara…' : 'Nasabah sudah berbicara'}</span>

function micTest() {
  const btn = $('#micBtn'), res = $('#micRes'); if (!btn || btn.disabled) return;
  const kal = 'Selamat pagi, selamat datang di Agen BNI 46. Ada yang bisa saya bantu?';
  try { speechSynthesis.cancel(); } catch (e) { }
  btn.disabled = true; res.innerHTML = `<div class="recbox"><span class="recdot"></span><b>Silakan bicara…</b><div class="meter"><i id="lvl"></i></div></div><div class="live" id="liveTxt">…</div>`;
  startCapture(normWords(kal).length, (lvl, txt) => { const b = $('#lvl'); if (b) b.style.width = Math.round(lvl * 100) + '%'; const lt = $('#liveTxt'); if (lt) lt.textContent = txt || '…'; }, cap => {
    const prev = S.kalibrasi; S.kalibrasi = null;
    const r = analyzeSpeech(cap, kal);
    btn.disabled = false;
    if (r.heard && r.kes >= 50) {
      S.kalibrasi = { db: r.db, med: r.med }; save();
      res.innerHTML = `<p class="msg ok">Mikrofon berfungsi. Terdengar: “${esc(r.said)}” (kesesuaian ${r.kes}%). ${r.noAudio ? 'Perangkat ini memakai <b>mode HP</b>: kesesuaian kalimat dinilai, intonasi tidak dinilai.' : 'Volume suara Anda saat ini dijadikan patokan volume wajar.'}</p>`;
      const g = $('#goBtn'); if (g) g.disabled = false;
    } else {
      S.kalibrasi = prev;
      const lvl = Math.min(100, Math.round((cap.peak || 0) * 400));
      const diag = `<br><span class="small">Mikrofon yang dipakai: <b>${esc(cap.label || 'tidak diketahui')}</b> · level suara tertinggi: <b>${lvl}%</b>${cap.err ? ` · kode: ${esc(cap.err)}` : ''}</span>`;
      if (cap.err === 'audio-capture' && !modeHP()) { S.modeHP = true; save(); }
      const saran = cap.err === 'audio-capture' && !cap.noAudio ? 'Perangkat ini tidak bisa merekam dan mengenali suara secara bersamaan. Lab sudah beralih ke <b>mode HP</b>. Tekan <b>Tes mikrofon</b> sekali lagi.'
        : cap.err === 'not-allowed' || cap.err === 'service-not-allowed' ? 'Izin mikrofon ditolak. Klik ikon gembok/mikrofon di bilah alamat lalu pilih Izinkan.'
        : cap.err === 'network' ? 'Pengenal suara Google tidak dapat dihubungi. Periksa koneksi internet, lalu coba lagi.'
        : lvl < 3 ? 'Mikrofon tersambung tetapi tidak menangkap suara. Periksa: (1) mikrofon yang dipilih Chrome (klik ikon mikrofon di bilah alamat), (2) Windows: Pengaturan > Privasi & keamanan > Mikrofon > izinkan aplikasi desktop, (3) mikrofon tidak di-mute dan tidak sedang dipakai aplikasi lain.'
        : 'Suara tertangkap tetapi belum dikenali sebagai ucapan. Bicaralah lebih jelas dan dekat ke mikrofon, pastikan internet tersambung, lalu coba lagi.';
      res.innerHTML = `<p class="msg bad">${r.heard ? `Ucapan kurang jelas: “${esc(r.said)}”. Coba ulangi lebih dekat ke mikrofon.` : saran}${diag}</p>`;
    }
  });
}

      ${p != null ? `<div class="explain ${q.o[p].ok ? 'okb' : 'badb'}"><b>${q.o[p].ok ? 'Benar!' : 'Kurang tepat.'}</b> ${esc(q.e)}</div><div class="nav"><span></span><button class="btn primary" data-act="eval-next">${E.i === E.qs.length - 1 ? 'Lihat nilai' : 'Soal berikutnya'} ${ico('next')}</button></div>` : ''}`;

  const B = CONFIG.BOBOT, uc = h.map(x => x.ucapan).filter(v => v != null), ucap = uc.length ? Math.round(sum(uc) / uc.length) : null, bu = ucap == null ? 0 : (B.ucapan || 0);
  const tb = B.studi + (B.sop || 0) + B.pelayanan + B.transaksi + (B.ketanggapan || 0) + bu + (B.laporan || 0) + B.evaluasi + (B.praktik || 0);
  const r = { studi: S.studi.skor || 0, sop: (S.sop && S.sop.skor) || 0, pelayanan: avg('pelayanan'), transaksi: avg('ketepatan'), ketanggapan: avg('ketanggapan'), ucapan: ucap, laporan: lapSkor(), evaluasi: S.eval.skor || 0, praktik: (S.ujian && S.ujian.done && S.ujian.skor) || 0 };

  r.predikat = r.akhir >= 90 ? 'A (Sangat Baik)' : r.akhir >= 80 ? 'B (Baik)' : r.akhir >= CONFIG.KKM ? 'C (Cukup)' : 'D (Perlu Bimbingan)';

    ${S.siswa ? `<p class="small">Masuk sebagai <b>${esc(S.siswa.nama)}</b> (${esc(S.siswa.kelas)}, ${esc(idLabel(S.siswa))})</p>` : ''}
    <div class="row" style="justify-content:space-between"><div class="row"><button class="btn ghost" data-act="reset-ask">Mulai ulang dari awal</button><button class="btn ghost" data-act="guru-masuk">${ico('lock')} Mode Guru</button></div><div class="row">${S.siswa && !S.akun ? '<button class="btn ghost" data-act="change-id">Ubah identitas</button>' : ''}<button class="btn primary" data-act="close">Tutup</button></div></div>`),
  'change-id': () => { if (S.akun) { toast('Identitas akun hanya dapat diubah guru di sheet Akun Murid.'); return; } go('identity'); },
  kalk: k => { if (k === 'buka') { KALK.open = true; kalkRender(); } else if (k === 'tutup') { KALK.open = false; kalkRender(); } else if (k === 'ins') kalkMasukkan(); else kalkTekan(k); },
  'guru-masuk': () => { if (PRATINJAU) { go('guru'); return; } modal(`<h3>${ico('lock')} Mode Pratinjau Guru</h3><p>Menu khusus guru untuk mencoba fitur tanpa mengulang dari awal. Data pratinjau terpisah dari progres murid dan nilai tidak dikirim.</p>
    <label class="fld"><span>PIN guru</span><input id="pinGuru" type="password" inputmode="numeric" autocomplete="off"></label><div id="pinErr"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">Batal</button><button class="btn primary" data-act="guru-pin">Masuk</button></div>`); setTimeout(() => { const i = $('#pinGuru'); if (i) i.focus(); }, 50); },
  'guru-pin': () => { const i = $('#pinGuru'); if (i && i.value === CONFIG.PIN_GURU) masukPratinjau(); else { $('#pinErr').innerHTML = '<p class="msg bad">PIN guru salah.</p>'; sfx.bad(); } },
  'guru-menu': () => { if (PRATINJAU) { L = null; MODE = 'shift'; go('guru'); } },
  'guru-keluar': () => keluarPratinjau(),
  pv: a => aksiPratinjau(a),
  'pv-nasabah': tp => { if (!PRATINJAU) return; S.lab = labSatu(tp); MODE = 'shift'; save(); go('lab'); },
  'pv-uji': tp => { if (!PRATINJAU) return; S.ujian = { done: false, skor: 0, layak: false, kritis: [], lab: labSatu(tp, true), ketik: false }; MODE = 'ujian'; save(); go('lab'); },
  'reset-ask': () => modal(`<h3>Mulai ulang dari awal?</h3><p>Seluruh progres dan nilai di perangkat ini akan dihapus. Nilai yang sudah terkirim ke guru tidak terhapus.</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">Batal</button><button class="btn primary" style="background:var(--bad);box-shadow:none" data-act="reset-all">Hapus progres</button></div>`),
  'reset-all': () => { const sf = S.sfx, sw = S.siswa, ak = S.akun; S = freshState(); S.sfx = sf; if (ak) { S.siswa = sw; S.akun = ak; } save(); L = E = ST = TP = null; if (ak) sinkron(); go(ak ? 'hub' : 'identity'); },
  sfx: () => { S.sfx = !S.sfx; save(); document.querySelectorAll('[data-act="sfx"]').forEach(b => b.innerHTML = ico(S.sfx ? 'sound' : 'mute')); toast(S.sfx ? 'Efek suara aktif' : 'Efek suara mati'); },
  full: () => { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) { toast('Layar penuh tidak didukung di sini.'); } },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, ix = a.indexOf(':');
  const name = ix < 0 ? a : a.slice(0, ix), arg = ix < 0 ? undefined : a.slice(ix + 1);
  if (ACT[name]) ACT[name](arg, b);
});
document.addEventListener('input', e => {
  const lp = e.target.dataset && e.target.dataset.lap;
  if (lp && VIEW === 'buka' && BK) { BK.v[lp] = e.target.value; e.target.classList.remove('bad'); return; }
  if (lp && TP) { if (/^[qs]\d/.test(lp)) TP.rows[lp] = e.target.value; else TP.v[lp] = e.target.value; e.target.classList.remove('bad'); return; }
  const f = e.target.dataset && e.target.dataset.f;
  if (f && L) {
    L.app.form[f] = e.target.value;
    const pv = document.querySelector(`[data-pv="${f}"]`);
    if (pv) pv.textContent = onlyDigits(e.target.value) ? fmt(onlyDigits(e.target.value)) : '';
  }
});
document.addEventListener('change', e => {
  const pv = e.target.dataset && e.target.dataset.pv; if (pv && PRATINJAU) { if (pv === 'suara') CONFIG.MODE_SUARA = e.target.checked; if (pv === 'bicara') CONFIG.MODE_BICARA = e.target.checked; toast('Pengaturan pratinjau diperbarui'); return; }
  if (e.target.dataset && e.target.dataset.decl != null && SP) { SP.decl[e.target.dataset.decl] = e.target.checked; viewSop(); return; } const f = e.target.dataset && e.target.dataset.f; if (f && L) L.app.form[f] = e.target.value; });
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.kalk-h'); if (!h || e.target.closest('button') || innerWidth <= 520) return;
  const w = document.getElementById('kalk'), r = w.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
  e.preventDefault();
  const mv = ev => { const x = Math.min(Math.max(0, ev.clientX - dx), innerWidth - r.width), y = Math.min(Math.max(0, ev.clientY - dy), innerHeight - 60);
    KALK.pos = { x, y }; Object.assign(w.style, { left: x + 'px', top: y + 'px', right: 'auto', bottom: 'auto' }); };
  const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
  addEventListener('pointermove', mv); addEventListener('pointerup', up);
});
document.addEventListener('focusin', e => {
  const k = e.target.dataset && e.target.dataset.lap; if (!k) return;
  document.querySelectorAll('.kalk-target').forEach(x => x.classList.remove('kalk-target'));
  e.target.classList.add('kalk-target'); LAP_FOKUS = k; if (KALK.open) kalkRender();
});
document.addEventListener('keydown', e => {
  if (KALK.open && kalkAktif() && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const m = { Enter: 'eq', '=': 'eq', Backspace: 'bs', Escape: 'c', Delete: 'c', x: '*', X: '*' }[e.key] || (/^[0-9]$/.test(e.key) || isOp(e.key) ? e.key : null);
    if (m) { e.preventDefault(); kalkTekan(m); return; }
  }
  if (e.key === 'Enter' && VIEW === 'splash') ACT.start();
  if (e.key === 'Enter' && e.target.id && /^i(Nama|Kelas|Absen)$/.test(e.target.id)) ACT['save-id']();
  if (e.key === 'Enter' && e.target.id === 'cashInVal') cashInOk();
  if (e.key === 'Enter' && e.target.id === 'pinGuru') ACT['guru-pin']();
  if (e.key === 'Enter' && /^(aNis|aNama|aPw|aPw2)$/.test(e.target.id)) ACT['akun-daftar']();
  if (e.key === 'Enter' && /^(mNis|mPw)$/.test(e.target.id)) ACT['akun-masuk']();
  if (e.key === 'Enter' && e.target.id === 'trxPw') trxOk();
  if (e.key === 'Enter' && /^ag(User|Pass)$/.test(e.target.id)) agenLogin();
  if (e.key === 'Enter' && /^bk(User|Pass)$/.test(e.target.id)) bukaLogin();
  if (e.key === 'Escape' && L && L.hold && VIEW === 'lab') { ACT['audio-go'](); return; }
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden') && !$('#modal .btn[data-act="next-cust"],#modal .btn[data-act="lab-finish"]')) closeModal();
});
go('splash');
// Bila akun masih masuk di perangkat ini, ambil progres terbaru dari server (mis. sempat dilanjutkan di perangkat lain).
(async function cekAwan() {
  if (!S.akun || PRATINJAU) return;
  try {
    const r = await serverAkun({ aksi: 'masuk', nis: S.akun.nis, h: S.akun.h });
    if (!r || !r.ok) { if (r && r.kode === 'password') toast('Password akun sudah berubah. Silakan keluar lalu masuk kembali.', 'bad'); return; }
    let p = null; try { p = r.progres ? JSON.parse(r.progres) : null; } catch (e) { }
    if (p && (p.upd || 0) > (S.upd || 0) + 1000) {
      const ak = S.akun, sf = S.sfx;
      S = Object.assign(freshState(), p); S.akun = ak; if (S.sfx == null) S.sfx = sf;
      S.siswa = { nama: r.nama, kelas: r.rombel, absen: ak.nis, nis: ak.nis };
      try { localStorage.setItem(SKEY(), JSON.stringify(S)); } catch (e) { }
      if (VIEW === 'hub' || VIEW === 'splash') go(VIEW);
      toast('Progres terbaru dari perangkat lain sudah dimuat.');
    }
    SYNC.at = SYNC.at || Date.now(); syncBadge();
  } catch (e) { }
})();
</script>
